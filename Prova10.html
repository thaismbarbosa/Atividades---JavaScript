<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Organizador de Tarefas</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
    }

    input {
        padding: 8px;
        width: 250px;
    }

    button {
        padding: 8px;
        cursor: pointer;
        margin-left: 5px;
    }

    ul {
        margin-top: 20px;
        padding: 0;
    }

    li {
        list-style: none;
        padding: 10px;
        margin-bottom: 5px;
        background-color: #f4f4f4;
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
    }

    .concluida {
        text-decoration: line-through;
        color: gray;
        background-color: #dcdcdc;
    }

    .remover-btn {
        background-color: red;
        color: white;
        border: none;
        padding: 5px;
    }
</style>
</head>

<body>

<h2>Organizador de Tarefas</h2>

<input type="text" id="tarefaInput" placeholder="Digite uma tarefa">
<button id="adicionarBtn">Adicionar Tarefa</button>

<ul id="listaTarefas"></ul>

<script>
    const input = document.getElementById("tarefaInput");
    const botaoAdicionar = document.getElementById("adicionarBtn");
    const lista = document.getElementById("listaTarefas");

    // Evento para adicionar tarefa
    botaoAdicionar.addEventListener("click", function() {

        if (input.value.trim() === "") {
            alert("Digite uma tarefa válida!");
            return;
        }

        // Criando elemento li
        const li = document.createElement("li");
        li.textContent = input.value;

        // Evento para marcar como concluída
        li.addEventListener("click", function() {
            li.classList.toggle("concluida");
        });

        // Criando botão remover
        const botaoRemover = document.createElement("button");
        botaoRemover.textContent = "Remover";
        botaoRemover.classList.add("remover-btn");

        // Evento para remover tarefa
        botaoRemover.addEventListener("click", function(event) {
            event.stopPropagation(); // evita marcar como concluída ao remover
            lista.removeChild(li);
        });

        li.appendChild(botaoRemover);
        lista.appendChild(li);

        input.value = "";
    });
</script>

</body>
</html>

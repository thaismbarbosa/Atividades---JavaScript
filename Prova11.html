<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Cadastro de Usuários</title>

<style>
body{
    font-family: Arial;
    margin:40px;
}

form{
    margin-bottom:20px;
}

input{
    display:block;
    margin:10px 0;
    padding:8px;
    width:250px;
}

button{
    padding:8px 12px;
    cursor:pointer;
}

#listaUsuarios{
    margin-top:20px;
}

.usuario{
    background:#f2f2f2;
    padding:10px;
    margin-bottom:10px;
}
</style>

</head>
<body>

<h2>Cadastro de Usuário</h2>

<form id="formCadastro">

<input type="text" id="nome" placeholder="Nome de usuário">

<input type="password" id="senha" placeholder="Senha">

<input type="tel" id="telefone" placeholder="Telefone">

<input type="date" id="nascimento">

<input type="email" id="email" placeholder="Email">

<button type="submit">Enviar</button>

</form>

<button id="limparLista">Limpar Lista</button>

<h3>Usuários Cadastrados</h3>

<div id="listaUsuarios"></div>

<script>

const form = document.getElementById("formCadastro");
const lista = document.getElementById("listaUsuarios");
const limpar = document.getElementById("limparLista");

form.addEventListener("submit", function(event){

    // impedir recarregamento da página
    event.preventDefault();

    const nome = document.getElementById("nome").value;
    const senha = document.getElementById("senha").value;
    const telefone = document.getElementById("telefone").value;
    const nascimento = document.getElementById("nascimento").value;
    const email = document.getElementById("email").value;

    // validação simples
    if(nome === "" || senha === "" || telefone === "" || nascimento === "" || email === ""){
        console.log("Erro: Todos os campos devem ser preenchidos.");
        return;
    }

    // criar elemento dinamicamente
    const divUsuario = document.createElement("div");
    divUsuario.classList.add("usuario");

    divUsuario.innerHTML = `
        <p><strong>Nome:</strong> ${nome}</p>
        <p><strong>Telefone:</strong> ${telefone}</p>
        <p><strong>Nascimento:</strong> ${nascimento}</p>
        <p><strong>Email:</strong> ${email}</p>
    `;

    // adicionar à lista
    lista.appendChild(divUsuario);

    // limpar formulário
    form.reset();

});


// botão limpar lista
limpar.addEventListener("click", function(){

    lista.innerHTML = "";

});

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Gerenciador de Notas</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 40px;
    }

    input[type="text"] {
        padding: 8px;
        width: 300px;
        margin-right: 5px;
    }

    button {
        padding: 8px 12px;
        cursor: pointer;
    }

    ul {
        margin-top: 20px;
        padding: 0;
    }

    li {
        list-style: none;
        background-color: #f4f4f4;
        margin-bottom: 10px;
        padding: 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .remover-btn {
        background-color: red;
        color: white;
        border: none;
        padding: 5px 8px;
        cursor: pointer;
    }
</style>
</head>
<body>

<h2>Gerenciador de Notas</h2>

<input type="text" id="tituloNota" placeholder="Digite o título da nota">
<button id="adicionarNotaBtn">Adicionar Nota</button>

<ul id="listaNotas"></ul>

<script>
    const inputTitulo = document.getElementById("tituloNota");
    const botaoAdicionar = document.getElementById("adicionarNotaBtn");
    const listaNotas = document.getElementById("listaNotas");

    // Função para carregar notas do Local Storage
    function carregarNotas() {
        listaNotas.innerHTML = ""; // limpa a lista antes de exibir
        const notas = JSON.parse(localStorage.getItem("notas")) || [];

        notas.forEach(nota => {
            const li = document.createElement("li");
            li.textContent = nota.titulo;

            const btnRemover = document.createElement("button");
            btnRemover.textContent = "Remover";
            btnRemover.classList.add("remover-btn");

            // Evento para remover nota
            btnRemover.addEventListener("click", function() {
                removerNota(nota.titulo);
            });

            li.appendChild(btnRemover);
            listaNotas.appendChild(li);
        });
    }

    // Função para adicionar nota
    function adicionarNota() {
        const titulo = inputTitulo.value.trim();
        if(titulo === "") {
            alert("Digite um título válido!");
            return;
        }

        const notas = JSON.parse(localStorage.getItem("notas")) || [];

        // Verifica se já existe uma nota com o mesmo título
        if(notas.some(n => n.titulo === titulo)) {
            alert("Já existe uma nota com esse título!");
            return;
        }

        notas.push({ titulo });
        localStorage.setItem("notas", JSON.stringify(notas));

        inputTitulo.value = "";
        carregarNotas();
    }

    // Função para remover nota
    function removerNota(titulo) {
        let notas = JSON.parse(localStorage.getItem("notas")) || [];
        notas = notas.filter(n => n.titulo !== titulo);
        localStorage.setItem("notas", JSON.stringify(notas));
        carregarNotas();
    }

    // Evento do botão adicionar
    botaoAdicionar.addEventListener("click", adicionarNota);

    // Carrega notas ao iniciar
    carregarNotas();
</script>

</body>
</html>
